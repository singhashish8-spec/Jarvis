name: Code Quality

on:
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check formatting (Black)
        run: black --check src tests || (echo "Run 'make format' locally and push again"; exit 1)

      - name: Check import order (isort)
        run: isort --check-only src tests || (echo "Run 'make format' locally and push again"; exit 1)

      - name: Lint (flake8)
        run: flake8 src tests --max-line-length=127
        continue-on-error: true
